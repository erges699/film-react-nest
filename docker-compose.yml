services:
  db:
    image: postgres:16.4
    container_name: film-db
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - internal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: film-pgadmin
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - internal
    depends_on:
      - db

  frontend:
    image: ghcr.io/${GIT_USER}/filmreactnestfront:latest
    container_name: film-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_BASE_URL: /
      VITE_API_URL: /api/afisha
      VITE_CDN_URL: /content/afisha
    volumes:
      - frontend-data:/app/dist
    networks:
      - internal

  backend:
    image: ghcr.io/${GIT_USER}/filmreactnestback:latest
    container_name: film-backend
    build:
      context: ./backend
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      PORT: 3000
      DATABASE_DRIVER: ${DATABASE_DRIVER}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal
    depends_on:
      - db

  server:
    build:
      context: ./nginx
    image: ghcr.io/${GIT_USER}/filmreactnestnginx:latest
    container_name: film-nginx
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "80:80"
    volumes:
      - frontend-data:/var/www
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  postgres-data:
  pgadmin-data:
  frontend-data:

networks:
  internal:
    driver: bridge
