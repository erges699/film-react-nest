# Общие настройки проксирования (вынесены в отдельный блок)
upstream backend_nodes {
    server backend:3000;  # Можно добавить несколько серверов при необходимости
}

# Настройки заголовков для проксирования
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;  # Укажите реальный домен при необходимости

    # Проксирование для API и контента
    location ~ ^/(api|content)/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_pass http://film-backend:3000;

        # Дополнительные настройки безопасности (опционально)
        proxy_redirect off;
        proxy_buffering off;
    }

    # Обслуживание статических файлов и SPA
    location / {
        root /var/www;
        index index.html index.htm;

        # Попытка найти файл, иначе вернуть index.html (для SPA)
        try_files $uri $uri/ /index.html;

        # Кеширование статических ресурсов (опционально)
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Защита от случайных запросов к скрытым директориям
    location ~ /\. {
        deny all;
        return 404;
    }
}
