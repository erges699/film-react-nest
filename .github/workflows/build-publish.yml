name: Publish Docker images

on:
  push:
    branches:
      - main
      - review-3
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner | lower }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/filmreactnestfront:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/filmreactnestfront:${{ github.sha }}
          build-args: |
            VITE_API_URL=http://localhost:3000/api

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/filmreactnestback:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/filmreactnestback:${{ github.sha }}
          build-args: |
            DATABASE_URL=postgresql://${{ env.DATABASE_USERNAME }}:${{ env.DATABASE_PASSWORD }}@db:5432/${{ env.DATABASE_NAME }}

      - name: Build and push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/nginx:${{ github.sha }}
